services:
  backend:
    build: ./backend
    container_name: stem-theory-backend
    ports:
      - "8001:8001"
    env_file: .env
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  frontend:
    build: ./frontend
    container_name: stem-theory-frontend
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      - VITE_API_URL=http://localhost:8001/api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  # Bot is opt-in: `docker compose --profile bot up` (needs BOT_TOKEN in .env).
  bot:
    build: ./bot
    container_name: stem-theory-bot
    env_file: .env
    environment:
      - BACKEND_URL=http://backend:8001
    depends_on:
      - backend
    profiles: ["bot"]

volumes:
  frontend_node_modules:
